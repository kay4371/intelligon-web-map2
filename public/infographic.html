<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Infographic Generator - Suntrenia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .feature {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }
        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .feature-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .feature-desc {
            color: #666;
            font-size: 0.9em;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        #preview {
            margin-top: 30px;
            text-align: center;
        }
        #preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Intelligence Infographic Generator</h1>
        <p class="subtitle">Create stunning visual intelligence reports instantly</p>
        
        <div class="feature-grid">
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-title">Auto-Generated</div>
                <div class="feature-desc">Pulls latest intelligence data</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-title">Beautiful Design</div>
                <div class="feature-desc">Professional infographics</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-title">Instant Export</div>
                <div class="feature-desc">Download as PNG/PDF</div>
            </div>
        </div>

        <button class="btn" onclick="generateInfographic()"> Generate Infographic</button>
        
        <div id="status" class="status"></div>
        <div id="preview"></div>
    </div>

    <script>
        async function generateInfographic() {
            const btn = document.querySelector('.btn');
            const status = document.getElementById('status');
            const preview = document.getElementById('preview');
            
            btn.disabled = true;
            status.className = 'status loading';
            status.textContent = ' Generating infographic... This may take 30-60 seconds...';
            preview.innerHTML = '';
            
            try {
                const response = await fetch('/api/cron/whatsapp-report', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-cron-secret': 'suntrenia_cron_2026_x9k3m2p8q5w7n4j6'
                    }
                });
                
                if (!response.ok) throw new Error('Generation failed');
                
                status.className = 'status success';
                status.textContent = ' Infographic generated successfully! Check your WhatsApp for the report.';
                
            } catch (error) {
                status.className = 'status error';
                status.textContent = ' Failed to generate infographic. Please try again.';
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
